<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem('tema');if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Gloock&family=Literata:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=optional">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Literata:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=optional" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Literata:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=optional"></noscript>
  <style>
{% include style.css %}
  </style>
</head>
<body class="sayfa-{{ page.layout }}">
  {% if page.layout == 'post' %}<div id="progress" aria-hidden="true"></div>{% endif %}
  <div class="wrap">
    <nav class="nav" aria-label="Main">
      <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>Archive</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        <button type="button" class="theme" id="theme-btn" aria-label="Change theme">Auto</button>
      </div>
    </nav>

    <main>{{ content }}</main>

    <footer>
      <span class="mono">{{ site.title }} · {{ site.time | date: "%Y" }}</span>
      <span class="footer-links">
        {% if site.instagram %}<a class="mono" href="https://instagram.com/{{ site.instagram }}" target="_blank" rel="noopener">Instagram</a>{% endif %}
        <a class="mono" href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </span>
    </footer>
  </div>
  <script src="{{ '/assets/main.js' | relative_url }}" defer></script>
</body>
</html>
