{%- if site.newsletter != "" -%}
<section class="newsletter{% if include.compact %} newsletter--compact{% endif %}">
  {% unless include.compact %}<h2>Get new posts by email</h2>{% endunless %}
  <p>{% if include.compact %}New posts in your inbox.{% else %}A short note when something new is published. No spam, unsubscribe anytime.{% endif %}</p>
  <form action="https://buttondown.com/api/emails/embed-subscribe/{{ site.newsletter }}" method="post" target="_blank" class="nl-form">
    <label class="visually-hidden" for="nl-email{% if include.compact %}-side{% endif %}">Email address</label>
    <input class="search" type="email" name="email" id="nl-email{% if include.compact %}-side{% endif %}" placeholder="you@example.com" required autocomplete="email">
    <button class="btn primary" type="submit">Subscribe</button>
  </form>
</section>
{%- endif -%}
