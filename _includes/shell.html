{%- comment -%} Üst şerit + arşiv paneli (dil menüsü ve tema dahil). Beklenen: T, exps, e (yoksa boş), versions, L. {%- endcomment -%}
  <div class="shell">
    <header class="bar">
      <button type="button" class="arc-btn" id="arc-btn" aria-controls="archive" aria-expanded="false" aria-label="{{ T.archive_open }}">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
      <a class="mark notranslate" translate="no" id="mark" href="{{ T.home | relative_url }}" aria-label="vonkarts">vonkarts</a>
      <div class="meta"><span id="streak">{{ T.streak }} 0</span><span class="week" id="week" aria-hidden="true"></span></div>
    </header>
