# Elle çalıştırılan Lighthouse ölçümü (canlı site; telefon ve masaüstü).
name: Lighthouse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run Lighthouse
        run: |
          S=https://vonkarts.github.io
          run() { npx --yes lighthouse@12.2.0 "$2" --quiet --output=json --output-path="lh-$1.json" --chrome-flags="--headless=new --no-sandbox" $3 || true; }
          for i in 1 2 3; do run "home-en-mobile-$i" "$S/"; run "home-tr-mobile-$i" "$S/tr/"; done
          run post-en-new-mobile "$S/why-ai-landscapes-make-us-stop-scrolling/"
          run home-en-desktop "$S/" "--preset=desktop"
      - name: Summarize
        run: python3 .github/scripts/lh_report.py
