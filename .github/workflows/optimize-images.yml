# Yeni görsel eklenince: büyükse küçültür, WebP kopyalarını üretir, repoya ekler
# ve siteyi yeniden yayınlatır. Böylece hiçbir yazı siteyi ağırlaştırmaz.
name: Optimize images

on:
  push:
    branches: [main]
    paths:
      - "images/**.jpg"
      - "images/**.jpeg"
      - "images/**.png"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Prepare images
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --quiet --break-system-packages pillow
          python3 .github/scripts/make_webp.py
      - name: Commit optimized images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain images)" ]; then echo "Görseller zaten hazır."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Optimize images (automatic WebP sizes)"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
