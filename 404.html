---
layout: null
permalink: /404.html
sitemap: false
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ site.data.game.en.not_found }} | {{ site.data.game.en.name }}</title>
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/game/game.css' | relative_url }}">
</head>
<body>
  <div class="shell">
    <header class="bar"><a class="mark" href="{{ '/' | relative_url }}">{{ site.data.game.en.name }}</a></header>
    <main class="stage">
      <p class="no" aria-hidden="true">404</p>
      <h1 class="title">{{ site.data.game.en.not_found }}</h1>
      <div class="opts">
        {%- for t in site.data.game %}
        <a class="opt" href="{{ t[1].home | relative_url }}" lang="{{ t[0] }}"><span class="k">{{ t[0] | upcase }}</span><span>{{ t[1].not_found_go }}</span></a>
        {%- endfor %}
      </div>
    </main>
  </div>
</body>
</html>
