# Blogun temel ayarları. İsmi ve alt başlığı buradan değiştirebilirsin.
title: vonkarts
description: Thoughts, notes and half-finished sentences.
author:
  name: vonkarts
  url: "https://vonkarts.github.io/about/"
url: "https://vonkarts.github.io"
baseurl: ""
lang: en_US
logo: /images/icon-512.png
timezone: UTC

# Hakkında kısmında kenar sütununda görünen kısa metin
about_short: "I write about landscapes, cities and the quiet in between."
instagram: vonkarts

# Bülten: Buttondown kullanıcı adını yazınca abone kutusu sitede görünür
newsletter: ""

# Paylaşım önizlemesinde (WhatsApp, Instagram, X) görünen varsayılan görsel
defaults:
  - scope:
      path: ""
    values:
      image: /images/social-card.jpg
  - scope:
      path: ""
      type: posts
    values:
      lang: en
  # Noindex kategori sayfaları ve Google doğrulama dosyası site haritasına girmesin
  - scope:
      path: "kategori"
    values:
      sitemap: false
  - scope:
      path: "googledd59405c5d8809f3.html"
    values:
      sitemap: false

permalink: /:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - CLAUDE.md
  - README.md
  - YAZI-SABLONU.md
  - images/BURAYA-GORSEL-YUKLE.txt
  - googledd59405c5d8809f3.html.txt
