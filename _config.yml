# Site ayarları. Site: her gün gerçek bir deney (5 dil). Oyunun adı her dilde _data/game.yml içinde.
title: vonkarts
description: "Every day, one real published experiment. Guess first, then see what really happened."
author:
  name: vonkarts
  url: "https://vonkarts.com/"
url: "https://vonkarts.com"
baseurl: ""
lang: en_US
logo: /images/icon-512.png
timezone: UTC

defaults:
  # Deneyler kendi şablonunu kullanır; her deneyin paylaşım görseli kendi dosyasında (image)
  - scope:
      path: ""
      type: experiments
    values:
      layout: experiment
  # Google doğrulama dosyası site haritasına girmesin
  - scope:
      path: "googledd59405c5d8809f3.html"
    values:
      sitemap: false

# Yayındaki deneyler: _experiments/<dil>/NNN-slug.md
# Sırada bekleyenler: _queue/<dil>/NNN-slug.md (yayında değil; her gün biri otomatik taşınır)
collections:
  experiments:
    output: true

markdown: kramdown

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - CLAUDE.md
  - DESIGN.md
  - README.md
  - _queue
  - googledd59405c5d8809f3.html.txt
